<style>

:root{
  --bg:#0A0A08;--bg-alt:#0E0E0B;--surface:#121110;--surface-2:#0F0E0C;
  --ink:#F4F1E8;--muted:rgba(238,232,214,.58);--faint:rgba(238,232,214,.36);
  --yellow:#FACC15;--yellow-b:#FFE600;--yellow-d:#EAB308;
  --green:#22C55E;--green-b:#4ADE80;--green-s:#86EFAC;
  --line:rgba(255,255,255,.09);--line-y:rgba(250,204,21,.22);--line-g:rgba(74,222,128,.22);
  --r-card:22px;--ease:cubic-bezier(.22,1,.36,1);
}

/* ===== LIGHT THEME ===== */
[data-theme="light"]{
  color-scheme:light;
  --bg:#FFFFFF;--bg-alt:#F5F7F3;--surface:#FFFFFF;--surface-2:#F3F5F0;
  --ink:#0B0F0C;--muted:rgba(11,15,12,.64);--faint:rgba(11,15,12,.44);
  --yellow:#01CA50;--yellow-b:#0BE36B;--yellow-d:#00A93F;
  --green:#01CA50;--green-b:#16A34A;--green-s:#22C55E;
  --line:rgba(11,15,12,.10);--line-y:rgba(1,202,80,.30);--line-g:rgba(1,202,80,.30);
}
html[data-theme="light"] ::selection{background:rgba(1,202,80,.24)}
[data-theme="light"] .nav.scrolled .nav-inner{background:rgba(255,255,255,.86);border-color:rgba(1,202,80,.32);box-shadow:0 24px 60px rgba(0,0,0,.10)}
[data-theme="light"] .btn-ghost{border-color:rgba(11,15,12,.26)}
[data-theme="light"] .row-i .ic{background:rgba(1,202,80,.10)}
[data-theme="light"] .slot{border-color:rgba(11,15,12,.14)}
/* inline svg brand accents -> green */
[data-theme="light"] [fill="#FACC15"]{fill:#01CA50}
[data-theme="light"] [stroke="#FACC15"]{stroke:#01CA50}
[data-theme="light"] [fill="#FFE600"]{fill:#0BE36B}
[data-theme="light"] [stroke="#FFE600"]{stroke:#0BE36B}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Instrument Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.6;overflow-x:hidden}
.serif{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400}
.mono{font-family:'JetBrains Mono',monospace}
::selection{background:rgba(250,204,21,.3)}
@media(pointer:coarse){.cursor-dot,.cursor-ring{display:none}}
@media(prefers-reduced-motion:reduce){.cursor-ring{display:none}}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:20px 40px;transition:padding .25s var(--ease)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;gap:24px;max-width:1280px;margin:0 auto;padding:0;border-radius:999px;background:transparent;border:1px solid transparent;transition:max-width .35s var(--ease),padding .25s var(--ease),background .25s var(--ease),box-shadow .3s var(--ease),border-color .25s var(--ease);color:var(--ink)}
.nav.scrolled{padding:12px 20px}
.nav.scrolled .nav-inner{width:max-content;max-width:calc(100vw - 40px);padding:9px 12px 9px 22px;background:rgba(13,13,11,.86);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-color:var(--line-y);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.logo{display:flex;align-items:center;gap:10px;font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:19px;letter-spacing:-.3px;white-space:nowrap;color:var(--ink);text-decoration:none}
.logo-mark{display:inline-flex;align-items:center}
.logo-mark img{display:block}
.logo-mark .logo-lt{display:none}
[data-theme="light"] .logo-mark .logo-dk{display:none}
[data-theme="light"] .logo-mark .logo-lt{display:block}
.links{display:flex;align-items:center;gap:26px}
.links a{text-decoration:none;font-size:14.5px;font-weight:500;color:var(--ink);opacity:.74;transition:opacity .2s}
.links a:hover{opacity:1}
.theme-toggle{position:relative;flex-shrink:0;width:40px;height:40px;border-radius:50%;border:1px solid rgba(244,241,232,.22);background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--ink);transition:border-color .2s,color .2s,background .2s}
.theme-toggle:hover{border-color:var(--yellow);color:var(--yellow)}
.theme-toggle svg{position:absolute;width:18px;height:18px;transition:opacity .3s,transform .45s var(--ease)}
.theme-toggle .i-sun{opacity:1;transform:rotate(0) scale(1)}
.theme-toggle .i-moon{opacity:0;transform:rotate(-90deg) scale(.5)}
[data-theme="light"] .theme-toggle{border-color:rgba(11,15,12,.18)}
[data-theme="light"] .menu-toggle{border-color:rgba(11,15,12,.18)}
[data-theme="light"] .theme-toggle .i-sun{opacity:0;transform:rotate(90deg) scale(.5)}
[data-theme="light"] .theme-toggle .i-moon{opacity:1;transform:rotate(0) scale(1)}
/* mobile nav */
.nav-right{display:flex;gap:10px;align-items:center}
.menu-toggle{display:none;flex-direction:column;justify-content:center;gap:5px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(244,241,232,.22);background:transparent;cursor:pointer;padding:0 11px;flex-shrink:0;transition:transform .42s var(--spring),border-color .2s}
.menu-toggle:active{transform:scale(.9)}
.menu-toggle.open{transform:scale(1.05);border-color:var(--line-y)}
.menu-toggle span{display:block;height:2px;width:100%;background:var(--ink);border-radius:2px;transition:transform .34s var(--spring),opacity .18s}
.menu-toggle.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.menu-toggle.open span:nth-child(2){opacity:0}
.menu-toggle.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.mobile-menu{display:flex;position:fixed;top:70px;left:14px;right:14px;z-index:99;flex-direction:column;gap:1px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 26px 60px rgba(0,0,0,.5);visibility:hidden;opacity:0;transform:translateY(-12px) scale(.96);transform-origin:top center;transition:visibility 0s linear .5s,opacity .2s var(--ease),transform .46s var(--spring)}
.mobile-menu a{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:13px;font-size:15.5px;font-weight:600;color:var(--ink);text-decoration:none;opacity:0;transform:translateY(-6px);transition:background .18s,color .18s,opacity .26s var(--ease),transform .42s var(--spring)}
.mobile-menu a::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);opacity:0;transform:scale(.3);transition:opacity .2s,transform .34s var(--spring)}
.mobile-menu.open a{opacity:1;transform:none}
.mobile-menu.open a:nth-child(1){transition-delay:.03s}
.mobile-menu.open a:nth-child(2){transition-delay:.07s}
.mobile-menu.open a:nth-child(3){transition-delay:.11s}
.mobile-menu.open a:nth-child(4){transition-delay:.15s}
.mobile-menu.open a:nth-child(5){transition-delay:.19s}
.mobile-menu a:hover{background:var(--surface-2)}
.mobile-menu a:hover::after,.mobile-menu a.on::after{opacity:1;transform:none}
.mobile-menu .mm-btns{display:flex;gap:8px;margin-top:5px;padding:10px 4px 2px;border-top:1px solid var(--line);opacity:0;transform:translateY(-6px);transition:opacity .26s var(--ease) .17s,transform .42s var(--spring) .17s}
.mobile-menu.open .mm-btns{opacity:1;transform:none}
.mobile-menu .mm-btns .btn{flex:1;justify-content:center;padding:11px 12px;font-size:14px}
.mobile-menu.open{visibility:visible;opacity:1;transform:none;transition:visibility 0s,opacity .2s var(--ease),transform .46s var(--spring)}
[data-theme="light"] .mobile-menu{box-shadow:0 30px 70px rgba(11,15,12,.18)}

.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;font-weight:600;font-size:14.5px;text-decoration:none;cursor:pointer;border:1px solid transparent;transition:transform .15s var(--ease),background .2s,border-color .2s,color .2s;font-family:'Instrument Sans',sans-serif}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--yellow);color:#0A0A08}

.btn-ghost{background:transparent;color:var(--ink);border-color:rgba(244,241,232,.3)}

.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow);margin-bottom:24px}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}

main{max-width:1280px;margin:0 auto;padding:0 40px;display:grid;grid-template-columns:.9fr 1.1fr;gap:26px;margin-top:-10px}
.rows{display:grid;gap:0}
.row-i{display:flex;align-items:center;gap:16px;padding:15px 0;border-top:1px solid var(--line)}
.row-i:first-child{border-top:none}
.row-i .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;background:rgba(250,204,21,.08);color:var(--yellow)}

.socials a:hover{color:var(--yellow);border-color:var(--line-y)}
/* calendly panel */
.cal{border-color:var(--line-y)}
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.cal-head .dot{width:9px;height:9px;border-radius:50%;background:var(--green);animation:pdot 2s var(--ease) infinite}

.cal-badge{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--green-b);border:1px solid var(--line-g);border-radius:999px;padding:3px 9px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:24px 0 20px}
.slot{border:1px solid var(--line);border-radius:14px;padding:13px 15px;font-size:13.5px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;transition:border-color .2s,color .2s}
.slot .d{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint)}
.slot.taken{opacity:.45;text-decoration:line-through}
.slot.open:hover{border-color:var(--line-y);color:var(--ink)}
.cal-note{font-size:12.5px;color:var(--faint);margin-top:14px;line-height:1.6}

.quick{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}
.quick span{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.note{max-width:1280px;margin:0 auto;padding:56px 40px 60px;font-size:12.5px;color:var(--faint)}
.note a{color:var(--yellow);text-decoration:none}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.reveal.in{opacity:1;transform:translateY(0)}

@media(max-width:960px){.band-cols{grid-template-columns:1fr 1fr}}

<script>
/* theme toggle — light is the default */
(function(){
  var root = document.documentElement, key = 'cm-theme';
  try {
    var saved = localStorage.getItem(key);
    if(saved === 'dark') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme','light');
  } catch(e){}
  var b = document.getElementById('themeToggle');
  if(!b) return;
  b.addEventListener('click', function(){
    var light = root.getAttribute('data-theme') === 'light';
    if(light){ root.removeAttribute('data-theme'); }
    else { root.setAttribute('data-theme','light'); }
    try { localStorage.setItem(key, light ? 'dark' : 'light'); } catch(e){}
  });
})();
/* mobile menu */
(function(){
  var t=document.getElementById('menuToggle'), m=document.getElementById('mobileMenu');
  if(!t||!m) return;
  function close(){ t.classList.remove('open'); m.classList.remove('open'); t.setAttribute('aria-expanded','false'); }
  t.addEventListener('click', function(e){ e.stopPropagation(); var o=!m.classList.contains('open'); m.classList.toggle('open',o); t.classList.toggle('open',o); t.setAttribute('aria-expanded',o); });
  document.addEventListener('click', function(e){ if(!e.target.closest('#nav')) close(); });
})();
</script>
